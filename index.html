<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c5ea7b"><title>さつまいもカーレース</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<main id="game" aria-label="さつまいもカーレース">
  <canvas id="world" width="1280" height="720" aria-label="野原の3レーンレース"></canvas>
  <section id="selection" class="screen">
    <div class="intro"><span class="eyebrow">うさぽんの野原で、よーいどん。</span><h1>さつまいもカーレース</h1><p>いっしょに走るうさぎを選んでね</p></div>
    <div id="characters" role="group" aria-label="うさぎを選択"></div>
    <div class="select-bottom"><p>上下で3レーン移動 · ジャンプで岩をこえよう<br><span>どんぐりで加速。4匹に勝ったら優勝！</span></p><button id="start" class="primary" disabled>準備中…</button></div>
  </section>
  <section id="hud" hidden>
    <div class="stage"><small>STAGE 1 · <span id="round">1</span> / 4 戦</small><strong>やさしい野原</strong></div>
    <div class="progress-area"><div class="progress-label"><span id="position">1位</span><span id="rival-name"></span><span>ゴール</span></div><div class="track"><div id="progress-fill"></div><span id="player-dot" class="dot player-dot">自</span><span id="rival-dot" class="dot rival-dot">相</span></div></div>
    <div class="inventory"><span class="acorn-icon" aria-hidden="true"></span><strong id="acorns">0</strong><span id="speed-state">いつもの速さ</span></div>
    <button id="pause" class="small-button" aria-label="一時停止">Ⅱ</button>
  </section>
  <div id="race-caption" hidden><span id="player-label"></span><span id="status-text" aria-live="polite"></span></div>
  <div id="controls" hidden><div class="lane-buttons"><button id="up" aria-label="上のレーンへ">▲</button><button id="down" aria-label="下のレーンへ">▼</button></div><button id="jump" aria-label="ジャンプ"><span>↗</span>ジャンプ</button></div>
  <div id="countdown" hidden aria-live="polite"></div>
  <section id="dialog" class="screen dialog" hidden aria-labelledby="dialog-title"><div class="result-card"><span id="result-kicker" class="eyebrow"></span><h2 id="dialog-title"></h2><div id="result-art"></div><p id="result-detail"></p><div id="wins" class="wins"></div><button id="continue" class="primary"></button><button id="back" class="text-button">うさぎを選びなおす</button></div></section>
  <button id="fullscreen" class="fullscreen" aria-label="全画面表示">⛶</button>
  <span id="keyboard-hint">↑ ↓ レーン移動　Space ジャンプ</span>
</main>
<div id="rotate"><div class="rotate-phone">↻</div><h2>横向きにして遊んでね</h2><p>回転できないときは、下のボタンで遊べます。</p><button id="play-rotated" class="rotate-start">このまま横画面で遊ぶ</button></div>
<script src="assets/bounds.js"></script><script src="engine.js"></script><script src="game.js?v=2"></script>
</body></html>
